name: Backend CI

on:
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Verify Backend Compilation & Tests
        run: |
          chmod +x mvnw
          if [ -f src/test/resources/application.properties ]; then
            ./mvnw test -B
          else
            ./mvnw test-compile -B
          fi
