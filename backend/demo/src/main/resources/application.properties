spring.application.name=demo

# Server Port
server.port= ${SERVER_PORT:8080}

# ========================================
# Application Environment Profile (dev | demo | prod)
# ========================================
app.env=${APP_ENV:demo}
app.seed.demo-accounts-path=${DEMO_ACCOUNTS_FILE:classpath:seeds/demo-accounts.json}

# ========================================
# CORS Configuration
# ========================================

# กำหนดค่า CORS โดเมนที่อนุญาตให้เรียกใช้งาน API พร้อม Default value 
app.cors.allowed-origins= ${ALLOWED_ORIGINS:http://localhost:3000,https://your-production-domain.com}


# ========================================
# External Services Configuration
# ========================================

# กำหนด External API Base URL ของ TU API พร้อม Default value
app.external-services.tu-api-base-url=${TU_API_BASE_URL:https://api.tu.ac.th/v1}

# กำหนด Path สำหรับตรวจสอบการเข้าสู่ระบบผ่าน TU API พร้อม Default value
app.external-services.tu-api-verify-path=${TU_API_VERIFY_PATH:/auth/Ad/verify}

# กำหด External API Token ของ TU API พร้อม Default value
app.external-services.tu-api-token=${TU_API_TOKEN:TU80bc4cfe53981bd7140bb8d46ec714c4c4902999f65cd78faea7afb11263cad6f23b29387e7002f5eb51ed360b177e87}

# ========================================
# Authentication & JWT Configuration
# ========================================
app.auth.mode=${AUTH_MODE:AUTO}
app.auth.demo-password=${DEMO_DEFAULT_PASSWORD:password123}
app.jwt.secret=${JWT_SECRET:CampusShareSuperSecretJwtKeyForHS256Signing2026!CS261G06}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ========================================
# Database Connection Configuration (MSSQL)
# ========================================

# URL การเชื่อมต่อ (ดึงจาก DB_URL ถ้าไม่มีใช้ localhost:1433)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=your_database_name;encrypt=true;trustServerCertificate=true;}

# Username (ดึงจาก DB_USERNAME ถ้าไม่มีใช้ sa)
spring.datasource.username=${DB_USERNAME:sa}

# Password (ดึงจาก DB_PASSWORD ถ้าไม่มีใช้ YourStrongPassword123)
spring.datasource.password=${DB_PASSWORD:YourStrongPassword123}

# กำหนด Driver Class สำหรับ MSSQL
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ========================================
# JPA & Hibernate Configuration
# ========================================

# ตั้งค่า Hibernate/JPA สำหรับจัดการตารางอัตโนมัติ (ดึงจาก HIBERNATE_DDL_AUTO ถ้าไม่มีใช้ update)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# แสดงคำสั่ง SQL ใน Console
spring.jpa.show-sql=${SHOW_SQL:true}

# จัดรูปแบบ SQL ใน Console ให้อ่านง่าย
spring.jpa.properties.hibernate.format_sql=true

# กำหนด Dialect สำหรับ MSSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# กำหนดให้รับไฟล์สูงสุดไม่เกิน 3MB ต่อไฟล์ และต่อ Request
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
file.upload-dir=${UPLOAD_DIR:uploads/products}

# ========================================
# Central API Route Mappings
# ========================================
app.api.base-path=${API_BASE_PATH:/api}
app.api.auth-path=${API_AUTH_PATH:/api/auth}
app.api.items-path=${API_ITEMS_PATH:/api/items}
app.api.requests-path=${API_REQUESTS_PATH:/api/requests}
app.api.users-path=${API_USERS_PATH:/api/users}
app.api.transactions-path=${API_TRANSACTIONS_PATH:/api/transactions}
app.api.evidence-path=${API_EVIDENCE_PATH:/api/evidence}