spring.application.name=demo-test

# H2 In-Memory Database in MSSQL Compatibility Mode for Self-Contained Tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS DATETIME2 AS TIMESTAMP
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.cors.allowed-origins=http://localhost:3000
app.external-services.tu-api-base-url=http://localhost:19999/v1
app.external-services.tu-api-verify-path=/auth/Ad/verify
app.external-services.tu-api-token=TEST_TU_TOKEN

app.auth.mode=HYBRID
app.auth.demo-password=password123
app.jwt.secret=CampusShareTestSecretJwtKeyForHS256Signing2026!CS261G06TestSuite
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

app.api.base-path=/api
app.api.auth-path=/api/auth
app.api.items-path=/api/items
app.api.requests-path=/api/requests
app.api.users-path=/api/users
app.api.transactions-path=/api/transactions
app.api.evidence-path=/api/evidence
