services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
      args:
        DB_PLATFORM: ${DB_PLATFORM:-linux/amd64}
        DB_IMAGE: ${DB_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: ${DB_PLATFORM:-linux/amd64}
    container_name: cs261-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StrongPassw0rd!}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./database/scripts:/scripts
    healthcheck:
      # MSSQL 2022 relocated sqlcmd to mssql-tools18 and enforces TLS (-C); fallback to /dev/tcp if tools differ
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cs261-backend
    env_file:
      - .env.example
    environment:
      # Spring Boot relaxed binding overrides application.properties keys without changing source code
      APP_CORS_ALLOWED_ORIGINS: "${LOCAL_WEB_URL:-http://localhost:3000},${PUBLIC_WEB_URL:-https://your-production-domain.com}"
      APP_EXTERNAL_SERVICES_TU_API_BASE_URL: "${TU_API_BASE_URL:-https://api.tu.ac.th/v1}"
      APP_EXTERNAL_SERVICES_TU_API_TOKEN: "${TU_API_TOKEN:-TU80bc4cfe53981bd7140bb8d46ec714c4c4902999f65cd78faea7afb11263cad6f23b29387e7002f5eb51ed360b177e87}"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=${DB_NAME:-master};encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-StrongPassw0rd!}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/demo/uploads:/app/uploads
      - ./storage/products:/app/uploads/products
      - ./storage/temporary:/app/uploads/temporary
      - ./storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://your-production-domain.com}
        VITE_API_BASE_PATH: ${API_BASE_PATH:-/api}
        VITE_TU_API_BASE_URL: ${TU_API_BASE_URL:-https://api.tu.ac.th/v1}
        VITE_API_AUTH_PATH: ${API_AUTH_PATH:-/api/auth}
        VITE_API_ITEMS_PATH: ${API_ITEMS_PATH:-/api/items}
        VITE_API_REQUESTS_PATH: ${API_REQUESTS_PATH:-/api/requests}
        VITE_API_USERS_PATH: ${API_USERS_PATH:-/api/users}
    container_name: cs261-frontend
    env_file:
      - .env.example
    environment:
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://your-production-domain.com}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8080}
      TU_API_BASE_URL: ${TU_API_BASE_URL:-https://api.tu.ac.th/v1}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      API_AUTH_PATH: ${API_AUTH_PATH:-/api/auth}
      API_ITEMS_PATH: ${API_ITEMS_PATH:-/api/items}
      API_REQUESTS_PATH: ${API_REQUESTS_PATH:-/api/requests}
      API_USERS_PATH: ${API_USERS_PATH:-/api/users}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  app-network:
    driver: bridge
